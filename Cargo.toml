[package]
name = "porter-cli"
version = "0.1.0"
edition = "2024"
description = "Interactive Linux TCP listeners for the current directory"
license = "MIT"

[[bin]]
name = "porter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
cli-command-kit = { git = "https://github.com/alexgorbatchev/cli-command-kit-rust.git", rev = "dead4a60e08c7a84bc77ef329b220bfecd57627b" }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde_json = "1.0.149"

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core = "0.9.0"
netlink-packet-sock-diag = "0.5.0"
netlink-sys = "0.9.0"
procfs = { version = "0.18.0", default-features = false }
rustix = { version = "1.1.5", features = ["process", "fs", "net"] }

[dev-dependencies]
tempfile = "3.27.0"
portable-pty = { version = "0.9.0", git = "https://github.com/alexgorbatchev/tui-frame-rust.git", rev = "3e3198f558f2d71e2f0e5b9c45bc559f26217378" }
vt100 = "0.16.2"
